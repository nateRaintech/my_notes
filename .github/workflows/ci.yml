name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Headless Qt: select the offscreen platform plugin so PySide6 widgets can
      # be constructed in CI without a display server. tests/test_app_launch.py
      # also sets this defensively, but setting it job-wide keeps it explicit.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # System libraries the Qt runtime needs to initialise the offscreen
      # platform plugin on a headless runner. Without these, importing PySide6
      # succeeds but constructing a QApplication aborts the process (uncatchable),
      # which importorskip cannot guard against — so install them explicitly.
      - name: Install Qt headless system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # Dev tooling, the GUI runtime (PySide6), and the crypto/storage deps a
      # test imports: argon2-cffi (the Argon2id KDF, tests/test_crypto.py) and
      # sqlcipher3 (the encrypted vault, tests/test_vault.py — the manylinux
      # wheel installs on ubuntu-latest). A dep enters CI only once a real test
      # imports it. See ROADMAP.md M2 and LESSONS.md.
      #
      # pyyaml and sqlparse back the tools suite's YAML and SQL tools (M9, #99).
      # They are imported lazily at runtime so a missing one degrades to a
      # message rather than an error — but tests/test_tools_core.py asserts what
      # those tools actually produce, so CI needs them genuinely installed.
      # This list is not read from requirements.txt: keep the two in step.
      - name: Install tooling and GUI runtime
        run: pip install ruff pytest PySide6 argon2-cffi "sqlcipher3>=0.6.2" pyyaml sqlparse

      - name: Lint
        run: ruff check .

      # The real test suite is the merge gate now: core/ unit tests (pure Python)
      # plus the PySide6 launch smoke test, run headless. No exit-5 "no tests
      # collected" crutch — a genuine test failure (or zero tests) fails the build.
      - name: Test
        run: pytest -q
