name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scaffold gate: lint + tests only. Runtime deps (PySide6, sqlcipher3-binary,
      # argon2-cffi) are intentionally NOT installed here yet — they get added once
      # M1/M2 tests actually need them (and after the SQLCipher spike confirms Linux
      # wheels are available). This keeps the merge gate green and fast on the initial
      # near-empty repo. See ROADMAP.md M1: "CI runs the real test suite + ruff".
      - name: Install tooling
        run: pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          set +e
          pytest -q
          code=$?
          # pytest exit code 5 = "no tests collected" — expected on the scaffold; pass.
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet (scaffold). Treating as pass."
            exit 0
          fi
          exit "$code"
